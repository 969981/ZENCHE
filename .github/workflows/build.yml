name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# Prefer the newest validation for the same branch/PR when commits arrive rapidly.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Compile Windows native workspace
        shell: pwsh
        run: dotnet build native/windows/NikonLink.Windows.csproj --configuration Release
      - name: Check proprietary SDK availability before installer packaging
        shell: pwsh
        run: |
          if ((Test-Path "S-SDKNEF-001BF-ALLIN.zip") -and
              (Test-Path "S-SDKZ-200BF-ALLIN.zip") -and
              (Test-Path "CrSDK_v2.02.00_20260610a_Win64.zip")) {
            Write-Host "SDKs supplied; installer packaging must use scripts/build-windows.ps1 with the matching official libusb DLL."
          } else {
            Write-Host "::notice::No Nikon/Sony SDK archives in Git checkout. Windows installer packaging is blocked; dotnet build validates source only."
          }

      - name: Download official x64 libusb for a separate develop test installer
        if: github.ref == 'refs/heads/develop'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "libusb-1.0.29.7z"
          $extractRoot = Join-Path $env:RUNNER_TEMP "libusb-1.0.29"
          Invoke-WebRequest -Uri "https://github.com/libusb/libusb/releases/download/v1.0.29/libusb-1.0.29.7z" -OutFile $archive
          7z x $archive "-o$extractRoot" -y
          if ($LASTEXITCODE -ne 0) { throw "libusb extraction failed" }
          $dll = Join-Path $extractRoot "VS2022\MS64\dll\libusb-1.0.dll"
          if (-not (Test-Path -LiteralPath $dll)) { throw "Official x64 libusb DLL missing" }
          "NIKONLINK_LIBUSB_DLL=$dll" >> $env:GITHUB_ENV
      - name: Install NSIS for isolated develop preview
        if: github.ref == 'refs/heads/develop'
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - name: Package independent Windows develop PTP-only test installer
        if: github.ref == 'refs/heads/develop'
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Runtime win-x64 -LibUsbDll $env:NIKONLINK_LIBUSB_DLL -PreviewWithoutVendorSdk
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/develop'
        with:
          name: ZENCHE-Windows-develop-PTP-only
          if-no-files-found: error
          path: |
            dist/ZENCHE-*-Windows-x64-develop-PTP-only-Setup.exe*
            dist/ZENCHE-*-Windows-x64-develop-PTP-only.zip*

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/build-ios.sh --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: ZENCHE-iOS-unsigned
          path: dist/ZENCHE-*-ios-unsigned.ipa*

  android:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # macos-15 已预装 Android cmdline-tools；setup-android@v3 在 2026
      # 对已移除的 sdkmanager "tools" 包执行安装会失败。
      - name: Confirm Android SDK command-line tools
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: ./scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ZENCHE-android
          path: dist/ZENCHE-*-android.apk*

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install gphoto2
      - name: Detect locally supplied proprietary SDK archives
        id: proprietary_sdks
        shell: bash
        run: |
          if [[ -f S-SDKNEF-001BF-ALLIN.zip && \
                -f S-SDKZ-200BF-ALLIN.zip && \
                -f CrSDK_v2.02.00_20260610a_Mac.zip ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nikon/Sony proprietary SDK archives are not stored in Git; running macOS source validation instead of packaging."
          fi
      - name: Build macOS package with proprietary SDKs
        if: steps.proprietary_sdks.outputs.available == 'true'
        run: ./scripts/build-macos.sh
      - name: Type-check macOS source without proprietary runtimes
        if: steps.proprietary_sdks.outputs.available != 'true'
        run: |
          xcrun swiftc -swift-version 5 -typecheck \
            -framework AppKit -framework SwiftUI -framework Photos \
            -framework AVKit -framework AVFoundation -framework CoreImage \
            -framework Network -framework CoreBluetooth -framework CoreLocation \
            native/ios/NikonLink/Models/CameraStorage.swift \
            native/ios/NikonLink/Connectivity/RemoteCaptureServices.swift \
            native/shared/NikonCloudPreview.swift \
            native/macos/Sources/NikonLink/*.swift
      - uses: actions/upload-artifact@v4
        if: steps.proprietary_sdks.outputs.available == 'true'
        with:
          name: ZENCHE-macOS
          path: dist/ZENCHE-*-macOS-*.dmg*
